name: Auto-Run Strategies

on:
  schedule:
    # Every 5 minutes — matches the 5-minute cooldown in auto_runner.py
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run enabled strategies
        run: python -m execution.auto_runner

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add data/
          git diff --staged --quiet || (git commit -m "chore: auto-run strategies [skip ci]" && git push origin main)